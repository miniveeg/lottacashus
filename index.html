<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#040406" />
    <title>LottaCash — Crypto Casino</title>

    <!-- Open Graph defaults — overridden per-route by react-helmet-async.
         description and og:description are intentionally omitted here so
         they aren't duplicated (react-helmet-async injects its own but
         doesn't strip the static ones). title and og:title stay as
         no-JS fallbacks. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LottaCash" />
    <meta property="og:title" content="LottaCash — Crypto Casino" />
    <meta property="og:url" content="https://lottacash.us/" />
    <meta property="og:image" content="https://lottacash.us/og-card.png" />

    <!-- Twitter Card defaults -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LottaCash — Crypto Casino" />
    <meta name="twitter:description" content="Eight provably fair house games. One wallet. Deposit SOL, LTC, or ETH. Cash out Sweeps Coins for real crypto." />
    <meta name="twitter:image" content="https://lottacash.us/og-card.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root">
      <div class="lc-boot" role="status" aria-live="polite">
        <img src="/logo.png" width="40" height="40" alt="" />
        <p>LottaCash</p>
      </div>
    </div>
    <style>
      html, body, #root { background: #0a0e14; min-height: 100dvh; margin: 0; }
      .lc-boot {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        color: #c9a84c;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      .lc-boot img { border-radius: 6px; }
      .lc-boot p { margin: 0; font-size: 0.85rem; }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
